<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#FF6B35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SOSO - 燃脂瘦身</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --orange:#FF6B35;
  --orange-light:#FF8F5E;
  --green:#00B894;
  --green-dark:#00A381;
  --gradient:linear-gradient(135deg,#FF6B35,#FF8F5E,#FFB347);
  --gradient-rev:linear-gradient(135deg,#00B894,#00D2A0);
  --gradient-fire:linear-gradient(135deg,#FF4500,#FF6B35,#FFB347);
  --bg:#0F0F12;
  --bg-card:#1A1A20;
  --bg-card2:#222229;
  --text:#FFFFFF;
  --text-sec:#888895;
  --text-muted:#5C5C6E;
  --radius:16px;
  --radius-sm:12px;
  --radius-lg:24px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --transition:all 0.35s cubic-bezier(.4,0,.2,1)
}
html,body{height:100%;width:100%;font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;background:var(--bg)}
/* Decorative BG */
#app::before{content:'';position:absolute;top:-200px;right:-120px;width:400px;height:400px;background:radial-gradient(circle,rgba(255,107,53,.12)0%,transparent 70%);border-radius:50%;pointer-events:none}
#app::after{content:'';position:absolute;bottom:-100px;left:-80px;width:300px;height:300px;background:radial-gradient(circle,rgba(0,184,148,.08)0%,transparent 70%);border-radius:50%;pointer-events:none}
/* ===== HEADER ===== */
.header{padding:calc(var(--safe-top)+10px)20px 8px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:10;flex-shrink:0}
.header-left{display:flex;align-items:center;gap:12px}
.logo{font-family:'Plus Jakarta Sans',sans-serif;font-weight:900;font-size:28px;background:var(--gradient-fire);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-1px;line-height:1}
.logo span{-webkit-text-fill-color:#fff;background:none;font-weight:300;opacity:.3}
.date-text{font-size:12px;color:var(--text-muted);font-weight:400}
.mode-badge{display:flex;align-items:center;gap:5px;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;transition:var(--transition)}
.mode-gentle{background:rgba(0,184,148,.15);color:var(--green)}
.mode-standard{background:rgba(255,107,53,.15);color:var(--orange)}
.mode-intense{background:rgba(255,69,0,.15);color:#FF4500}
/* ===== PAGE CONTAINER ===== */
#page-container{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 16px 8px;position:relative;z-index:1;-webkit-overflow-scrolling:touch}
#page-container::-webkit-scrollbar{display:none}
/* ===== TAB BAR ===== */
.tab-bar{flex-shrink:0;display:flex;align-items:flex-start;justify-content:space-around;padding:6px 8px calc(var(--safe-bottom)+6px);background:rgba(26,26,32,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.04);position:relative;z-index:10}
.tab-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 12px;border:none;background:transparent;cursor:pointer;position:relative;transition:var(--transition);min-width:52px}
.tab-icon{font-size:20px;line-height:1.2;opacity:.5;transition:var(--transition)}
.tab-label{font-size:10px;font-weight:500;color:var(--text-muted);transition:var(--transition);letter-spacing:.3px}
.tab-item.active .tab-icon{opacity:1;transform:scale(1.1)}
.tab-item.active .tab-label{color:var(--orange);font-weight:700}
.tab-item.active::before{content:'';position:absolute;top:-2px;left:50%;transform:translateX(-50%);width:24px;height:3px;border-radius:2px;background:var(--gradient)}
/* ===== UTILITY ===== */
.page{display:none;padding-bottom:16px}.page.active{display:block;animation:pageIn .4s cubic-bezier(.4,0,.2,1) forwards}
@keyframes pageIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--bg-card);border-radius:var(--radius);padding:18px;margin-bottom:12px;position:relative;overflow:hidden}
.card-glow::before{content:'';position:absolute;top:-50%;right:-50%;width:100%;height:100%;background:radial-gradient(circle,rgba(255,107,53,.06)0%,transparent 70%);pointer-events:none}
.card-green::before{content:'';position:absolute;top:-50%;left:-50%;width:100%;height:100%;background:radial-gradient(circle,rgba(0,184,148,.06)0%,transparent 70%);pointer-events:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 24px;border:none;border-radius:var(--radius-sm);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:var(--transition);-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--gradient);color:#fff;box-shadow:0 4px 20px rgba(255,107,53,.3)}
.btn-outline{background:transparent;color:var(--orange);border:1.5px solid rgba(255,107,53,.3)}
.btn-ghost{background:var(--bg-card2);color:var(--text-sec)}
.btn-full{width:100%}
.tag{display:inline-block;padding:3px 10px;border-radius:8px;font-size:11px;font-weight:600}
.tag-orange{background:rgba(255,107,53,.15);color:var(--orange)}
.tag-green{background:rgba(0,184,148,.15);color:var(--green)}
.tag-red{background:rgba(255,69,0,.15);color:#FF4500}
.progress-bar{height:6px;background:var(--bg-card2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:var(--gradient);border-radius:3px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.progress-fill-green{background:var(--gradient-rev)}
.row{display:flex;align-items:center;justify-content:space-between;padding:10px 0}
.row+.row{border-top:1px solid rgba(255,255,255,.04)}
.row-label{font-size:13px;color:var(--text-sec)}
.row-value{font-size:14px;font-weight:600}
/* Checkbox */
.check-item{display:flex;align-items:center;gap:12px;padding:12px 0;cursor:pointer}
.check-item+.check-item{border-top:1px solid rgba(255,255,255,.04)}
.check-box{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:var(--transition)}
.check-box.done{background:var(--gradient);border-color:transparent}
.check-box.done::after{content:'✓';color:#fff;font-size:14px;font-weight:700}
.check-info{flex:1}.check-title{font-size:14px;font-weight:500}
.check-sub{font-size:12px;color:var(--text-muted);margin-top:2px}
/* Toggle */
.toggle{position:relative;display:inline-block;width:46px;height:26px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;cursor:pointer;inset:0;background:var(--bg-card2);border-radius:26px;transition:var(--transition)}
.toggle-slider::before{content:'';position:absolute;height:20px;width:20px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:var(--transition)}
.toggle input:checked+.toggle-slider{background:var(--gradient)}
.toggle input:checked+.toggle-slider::before{transform:translateX(20px)}
/* ===== WELCOME PAGE ===== */
.welcome{text-align:center;padding:30px 0 10px}
.welcome-logo{font-family:'Plus Jakarta Sans',sans-serif;font-weight:900;font-size:52px;background:var(--gradient-fire);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-2px}
.welcome-sub{font-size:16px;color:var(--text-sec);margin-top:-6px}
.welcome-desc{font-size:13px;color:var(--text-muted);margin-top:10px;line-height:1.7}
.welcome .flame{font-size:48px;display:block;margin-bottom:8px;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.form-group{margin-bottom:14px;text-align:left}
.form-label{display:block;font-size:12px;color:var(--text-sec);margin-bottom:6px;font-weight:500;letter-spacing:.3px}
.form-input{width:100%;padding:12px 14px;border:1.5px solid rgba(255,255,255,.06);border-radius:var(--radius-sm);font-family:inherit;font-size:14px;transition:var(--transition);background:var(--bg-card2);color:#fff;outline:none}
.form-input:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,107,53,.1)}
.form-input::placeholder{color:var(--text-muted)}
.gender-select{display:flex;gap:10px}
.gender-btn{flex:1;padding:10px;border:1.5px solid rgba(255,255,255,.06);border-radius:var(--radius-sm);background:var(--bg-card2);color:var(--text-sec);font-family:inherit;font-size:14px;cursor:pointer;transition:var(--transition);text-align:center}
.gender-btn.active{background:rgba(255,107,53,.1);border-color:var(--orange);color:var(--orange);font-weight:600}
.health-tags{display:flex;flex-wrap:wrap;gap:8px}
.health-tag{padding:7px 16px;border:1.5px solid rgba(255,255,255,.06);border-radius:20px;background:var(--bg-card2);color:var(--text-sec);font-family:inherit;font-size:13px;cursor:pointer;transition:var(--transition)}
.health-tag.active{background:rgba(255,107,53,.1);border-color:var(--orange);color:var(--orange)}
.mode-card{display:flex;align-items:center;gap:12px;padding:14px;border:1.5px solid rgba(255,255,255,.06);border-radius:var(--radius-sm);cursor:pointer;transition:var(--transition);margin-bottom:8px}
.mode-card.selected{border-color:var(--orange);background:rgba(255,107,53,.06)}
.mc-icon{font-size:28px}.mc-info{flex:1}
.mc-name{font-size:15px;font-weight:700}
.mc-detail{font-size:12px;color:var(--text-muted);margin-top:2px}
.mc-radio{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mc-badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;background:rgba(255,107,53,.15);color:var(--orange)}
.mode-card.selected .mc-radio{border-color:var(--orange)}
.mode-card.selected .mc-radio::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--orange)}
/* ===== HOME ===== */
.home-greeting{font-size:14px;color:var(--text-sec);margin-bottom:2px}
.home-title{font-size:24px;font-weight:800;margin-bottom:6px;line-height:1.2}
.home-title em{font-style:normal;background:var(--gradient-fire);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.progress-ring{width:80px;height:80px;position:relative;flex-shrink:0}
.progress-ring svg{transform:rotate(-90deg)}
.progress-ring .ring-bg{fill:none;stroke:var(--bg-card2);stroke-width:5}
.progress-ring .ring-fill{fill:none;stroke:url(#grad);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .8s ease}
.ring-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.ring-num{font-size:20px;font-weight:800;font-family:'Plus Jakarta Sans',sans-serif;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.ring-label{font-size:9px;color:var(--text-muted);margin-top:-2px;display:block}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat-item{background:var(--bg-card2);border-radius:var(--radius-sm);padding:12px;text-align:center}
.stat-num{font-size:20px;font-weight:800;font-family:'Plus Jakarta Sans',sans-serif;color:var(--orange);display:block}
.stat-num.green{color:var(--green)}
.stat-label{font-size:11px;color:var(--text-muted);margin-top:2px;display:block}
.quick-check{margin-top:14px}
/* ===== DIET PAGE ===== */
.cal-display{font-size:40px;font-weight:900;font-family:'Plus Jakarta Sans',sans-serif;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.cal-label{font-size:13px;color:var(--text-muted)}
.food-chip{display:inline-block;padding:6px 12px;background:var(--bg-card2);border-radius:8px;font-size:12px;margin:3px;color:var(--text-sec)}
.food-chip .fc-cal{color:var(--text-muted);font-size:11px}
.avoid-item{display:flex;gap:8px;padding:8px 0;font-size:13px}
.avoid-item+.avoid-item{border-top:1px solid rgba(255,255,255,.04)}
.avoid-name{font-weight:500;white-space:nowrap;color:var(--orange)}
.avoid-reason{color:var(--text-muted)}
.water-btns{display:flex;gap:8px;margin-top:10px}
.water-btn{flex:1;padding:10px;border-radius:var(--radius-sm);border:1.5px solid rgba(0,184,148,.2);background:transparent;color:var(--green);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:var(--transition)}
.water-btn:active{background:rgba(0,184,148,.1)}
/* ===== EXERCISE ===== */
.ex-targets{display:flex;gap:8px}
.ex-target{flex:1;background:var(--bg-card2);border-radius:var(--radius-sm);padding:12px;text-align:center}
.ex-target .et-num{display:block;font-size:18px;font-weight:700;color:var(--orange);font-family:'Plus Jakarta Sans',sans-serif}
.ex-target .et-label{font-size:11px;color:var(--text-muted)}
.ex-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg-card2);border-radius:var(--radius-sm);margin-bottom:6px}
.ex-info{flex:1}.ex-name{font-size:13px;font-weight:500}
.ex-detail{font-size:11px;color:var(--text-muted);margin-top:1px}
.ex-badge{font-size:10px;padding:2px 8px;border-radius:8px;font-weight:600}
.ex-badge.low{background:rgba(0,184,148,.1);color:var(--green)}
.ex-badge.mid{background:rgba(255,107,53,.1);color:var(--orange)}
.ex-badge.high{background:rgba(255,69,0,.1);color:#FF4500}
/* ===== SLEEP ===== */
.sleep-schedule{padding:4px 0}
.sleep-row{display:flex;align-items:center;gap:14px;padding:10px 0}
.sleep-row+.sleep-row{border-top:1px solid rgba(255,255,255,.04)}
.sleep-time{font-size:12px;font-weight:600;min-width:95px;letter-spacing:.3px}
.sleep-action{font-size:13px;color:var(--text-sec)}
.sleep-tip{display:flex;align-items:flex-start;gap:8px;padding:8px 0;font-size:13px;color:var(--text-sec);line-height:1.5}
.sleep-tip+.sleep-tip{border-top:1px solid rgba(255,255,255,.04)}
/* ===== PROFILE ===== */
.avatar{width:56px;height:56px;border-radius:50%;background:var(--gradient);display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}
.profile-stats{display:flex;gap:8px;margin-top:12px}
.profile-stat{flex:1;background:var(--bg-card2);border-radius:var(--radius-sm);padding:10px;text-align:center}
.ps-num{font-size:18px;font-weight:700;display:block;color:#fff}
.ps-label{font-size:10px;color:var(--text-muted);margin-top:1px}
.pmc-card{display:flex;align-items:center;gap:10px;padding:12px;border:1.5px solid rgba(255,255,255,.06);border-radius:var(--radius-sm);margin-bottom:8px;cursor:pointer;transition:var(--transition)}
.pmc-card.selected{border-color:var(--orange);background:rgba(255,107,53,.06)}
.pmc-radio{width:20px;height:20px;border-radius:50%;border:2px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pmc-card.selected .pmc-radio{border-color:var(--orange)}
.pmc-card.selected .pmc-radio::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--orange)}
.reminder-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0}
.reminder-row+.reminder-row{border-top:1px solid rgba(255,255,255,.04)}
.rr-title{font-size:13px}.rr-time{font-size:11px;color:var(--text-muted);margin-left:6px}
.rr-info{display:flex;align-items:center;gap:6px}
/* ===== STATS ===== */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-hdr{font-size:10px;color:var(--text-muted);padding:4px 0;font-weight:600}
.cal-day{padding:6px 0;font-size:12px;border-radius:50%;transition:var(--transition)}
.cal-day.today{font-weight:700;color:var(--orange);border:2px solid var(--orange)}
.cal-day.done{background:var(--gradient);color:#fff;font-weight:700}
.cal-day.empty{visibility:hidden}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.achieve-item{display:flex;align-items:center;gap:10px;padding:10px 0}
.achieve-item+.achieve-item{border-top:1px solid rgba(255,255,255,.04)}
.achieve-icon{font-size:22px}.achieve-info{flex:1}
.achieve-name{font-size:13px;font-weight:500}.achieve-desc{font-size:11px;color:var(--text-muted)}
.achieve-status{font-size:11px;font-weight:600;padding:3px 10px;border-radius:8px;background:var(--bg-card2);color:var(--text-muted)}
.achieve-status.done{background:rgba(0,184,148,.1);color:var(--green)}
/* ===== KNOWLEDGE ===== */
.know-item{background:var(--bg-card);border-radius:var(--radius);padding:16px;margin-bottom:8px;cursor:pointer;transition:var(--transition)}
.know-item .ki-title{font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.know-item .ki-arrow{font-size:12px;color:var(--text-muted);transition:var(--transition)}
.know-item.open .ki-arrow{transform:rotate(180deg)}
.know-item .ki-body{max-height:0;overflow:hidden;transition:max-height .3s ease,opacity .3s ease;opacity:0}
.know-item.open .ki-body{max-height:400px;opacity:1;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.04)}
.know-item .ki-text{font-size:13px;color:var(--text-sec);line-height:1.7;white-space:pre-line}
</style>
</head>
<body>
<div id="app">

<!-- HEADER -->
<header class="header">
  <div class="header-left">
    <div class="logo">SOSO<span>.</span></div>
    <div class="date-text" id="headerDate"></div>
  </div>
  <div class="mode-badge mode-gentle" id="modeBadge">
    <span class="mode-icon">🌱</span>
    <span class="mode-text">温和模式</span>
  </div>
</header>

<!-- PAGE CONTAINER -->
<main id="page-container"></main>

<!-- TAB BAR -->
<nav class="tab-bar" id="tabBar">
  <button class="tab-item" data-page="home"><span class="tab-icon">🔥</span><span class="tab-label">首页</span></button>
  <button class="tab-item" data-page="diet"><span class="tab-icon">🥗</span><span class="tab-label">饮食</span></button>
  <button class="tab-item" data-page="exercise"><span class="tab-icon">🏃</span><span class="tab-label">运动</span></button>
  <button class="tab-item" data-page="sleep"><span class="tab-icon">😴</span><span class="tab-label">作息</span></button>
  <button class="tab-item" data-page="profile"><span class="tab-icon">👤</span><span class="tab-label">我的</span></button>
</nav>

</div>

<script>
// ===== CONSTANTS =====
const MODES={
  gentle:{id:'gentle',name:'温和模式',icon:'🌱',monthlyLoss:'4~6斤',weeklyLoss:'1~1.5斤',dailyCalories:{male:[1800,2000],female:[1500,1700]},deficit:[300,500],macroRatio:{carb:.55,protein:.2,fat:.25},proteinPerKg:1.2,waterML:1500,exercise:{cardio:{timesPerWeek:3,minutesPerSession:30,intensity:'低'},strength:{timesPerWeek:1,minutesPerSession:15}},dietTips:'正常三餐减油减糖，控制分量',suitableFor:'初次减肥、追求长期效果'},
  standard:{id:'standard',name:'标准模式',icon:'🔥',monthlyLoss:'6~8斤',weeklyLoss:'1.5~2斤',dailyCalories:{male:[1500,1800],female:[1300,1500]},deficit:[500,700],macroRatio:{carb:.45,protein:.3,fat:.25},proteinPerKg:1.5,waterML:1800,exercise:{cardio:{timesPerWeek:5,minutesPerSession:40,intensity:'中'},strength:{timesPerWeek:2,minutesPerSession:20}},dietTips:'严格控油，减少主食1/3，增加蛋白',suitableFor:'有一定减肥经验'},
  intense:{id:'intense',name:'燃脂模式',icon:'⚡',monthlyLoss:'8~10斤',weeklyLoss:'2~2.5斤',dailyCalories:{male:[1200,1500],female:[1000,1200]},deficit:[700,900],macroRatio:{carb:.4,protein:.35,fat:.25},proteinPerKg:1.8,waterML:2000,exercise:{cardio:{timesPerWeek:6,minutesPerSession:50,intensity:'高'},strength:{timesPerWeek:3,minutesPerSession:25}},dietTips:'严格控制热量，高蛋白低碳水',suitableFor:'有经验、意志力强'}
};
const REMINDERS=[
  {id:'wakeup',time:'07:00',title:'☀️ 起床啦',body:'喝一杯温水'},{id:'breakfast',time:'08:00',title:'🥣 早餐时间',body:'记得吃营养早餐'},

}

function toggleMeal(m){const r=getToday();if(!r.diet)r.diet={b:false,l:false,d:false,w:0};r.diet[m]=!r.diet[m];saveToday(r);loadPage('diet')}
function addWater(n){const r=getToday();if(!r.diet)r.diet={b:false,l:false,d:false,w:0};r.diet.w=(r.diet.w||0)+n;saveToday(r);loadPage('diet')}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

// ===== RENDER: PROFILE =====

function switchMode(id){if(id==='intense'&&!confirm('⚠️ 快速减重可能加重脂肪肝，确定吗？'))return;persist('mode',id);currentModeId=id;updateModeBadge();loadPage('profile')}
function togR(id,v){persist('rem_'+id,v)}
function toggleAllR(v){REMINDERS.forEach(r=>persist('rem_'+r.id,v));loadPage('profile')}
function togSnd(v){persist('sound',v)}
function updWt(v){const p=load('profile',{});p.weight=parseFloat(v)||p.weight;persist('profile',p);loadPage('profile')}
function updTgt(v){const p=load('profile',{});p.targetWeight=parseFloat(v)||p.targetWeight;persist('profile',p);loadPage('profile')}
function initProfile(){}
// ===== RENDER: STATS =====
function renderStats(){
  const d=new Date();const y=d.getFullYear(),m=d.getMonth();
  let html=`<div class="card">
  <div class="cal-nav">
    <button class="btn btn-ghost" style="padding:6px 12px;font-size:13px;" onclick="chgMo(-1)">‹ 上月</button>
    <span style="font-size:15px;font-weight:700;">${y}年${m+1}月</span>
    <button class="btn btn-ghost" style="padding:6px 12px;font-size:13px;" onclick="chgMo(1)">下月 ›</button>
  </div>
  <div class="cal-grid">${['一','二','三','四','五','六','日'].map(h=>`<div class="cal-hdr">${h}</div>`).join('')}
  ${'  '.repeat(new Date(y,m,1).getDay()===0?6:new Date(y,m,1).getDay()-1).split('').map(()=>'<div class="cal-day empty"></div>').join('')}
  ${Array.from({length:new Date(y,m+1,0).getDate()},(_,i)=>i+1).map(dd=>{
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
    const today=`${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}-${String(new Date().getDate()).padStart(2,'0')}`;
    const r=load('day_'+ds,null);
    let cls='cal-day';if(ds===today)cls+=' today';if(r&&(r.diet?.b||r.ex?.done||r.sl?.slept))cls+=' done';
    return `<div class="${cls}">${dd}</div>`
  }).join('')}</div>
</div>`;
  // achievements
  let total=0;for(let i=0;i<31;i++){const d2=new Date(y,m,i+1);const ds=d2.toISOString().split('T')[0];const r=load('day_'+ds,null);if(r&&(r.diet?.b||r.ex?.done||r.sl?.slept))total++}
  let streak=0;for(let i=0;i<365;i++){const d2=new Date();d2.setDate(d2.getDate()-i);const ds=d2.toISOString().split('T')[0];const r=load('day_'+ds,null);if(r&&(r.diet?.b||r.ex?.done||r.sl?.slept))streak++;else break}
  html+=`<div class="card">
    <h3 style="font-size:15px;font-weight:700;margin-bottom:8px;">🏆 成就</h3>
    <div class="achieve-item"><span class="achieve-icon">🌟</span><div class="achieve-info"><div class="achieve-name">初次打卡</div><div class="achieve-desc">完成第一次打卡</div></div><span class="achieve-status ${total>0?'done':''}">${total>0?'✅ 已达成':'未达成'}</span></div>
    <div class="achieve-item"><span class="achieve-icon">🔥</span><div class="achieve-info"><div class="achieve-name">坚持一周</div><div class="achieve-desc">连续打卡7天</div></div><span class="achieve-status ${streak>=7?'done':''}">${streak>=7?'✅ 已达成':streak+'天'}</span></div>
    <div class="achieve-item"><span class="achieve-icon">💎</span><div class="achieve-info"><div class="achieve-name">月度之星</div><div class="achieve-desc">月打卡超过20天</div></div><span class="achieve-status ${total>=20?'done':''}">${total>=20?'✅ 已达成':total+'天'}</span></div>
  </div>`;
  return html
}
function chgMo(d){/* simplified - just reload */loadPage('stats')}
function initStats(){}
// ===== RENDER: KNOWLEDGE =====
function renderKnowledge(){return`
<div class="card card-glow" style="background:linear-gradient(135deg,rgba(255,107,53,.1),rgba(255,179,71,.05));border:1px solid rgba(255,107,53,.1);">

  <p style="font-size:13px;color:var(--text-sec);margin-top:4px;">高血脂 · 脂肪肝知识</p>
</div>
${KNOWLEDGE.map((k,i)=>`<div class="know-item" onclick="togKnow(${i})"><div class="ki-title"><span>${k.title}</span><span class="ki-arrow">▼</span></div><div class="ki-body"><div class="ki-text">${k.content}</div></div></div>`).join('')}
`}
function togKnow(i){document.querySelectorAll('.know-item')[i]?.classList.toggle('open')}
function initKnowledge(){}
// ===== UTILITIES =====
function updateModeBadge(){
  const m=MODES[load('mode','gentle')];const b=document.getElementById('modeBadge');if(!b)return;
  b.className='mode-badge mode-'+m.id;const ic=b.querySelector('.mode-icon'),tx=b.querySelector('.mode-text');
  if(ic)ic.textContent=m.icon;if(tx)tx.textContent=m.name
}
function updateDate(){
  const n=new Date();const ops={month:'long',day:'numeric',weekday:'short'};
  const el=document.getElementById('headerDate');if(el)el.textContent=n.toLocaleDateString('zh-CN',ops)
}
</script>
